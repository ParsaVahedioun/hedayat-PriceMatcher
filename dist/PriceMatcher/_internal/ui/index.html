<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price Matcher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================ HOME ============================ -->
<section id="view-home" class="view active">
  <header class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 3 7v6c0 5 3.8 8.4 9 9 5.2-.6 9-4 9-9V7l-9-5Z"/>
        <path d="m8.5 12 2.5 2.5 4.5-4.5"/>
      </svg>
    </div>
    <h1>PRICE MATCHER</h1>
    <p>قیمت هر کالای انبار از روی لیست قیمت PDF پیدا می‌شود — کاملاً آفلاین</p>
  </header>

  <div class="card">
    <div class="picker" id="pick-pdf">
      <span class="picker-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/>
          <path d="M14 3v5h5"/>
          <path d="M9 13h6M9 17h4"/>
        </svg>
      </span>
      <div class="picker-info">
        <span class="picker-label">فایل PDF لیست قیمت</span>
        <span class="picker-file" id="pdf-name">انتخاب نشده</span>
      </div>
      <button class="btn btn-ghost" data-action="select-pdf">انتخاب PDF</button>
    </div>

    <div class="picker" id="pick-excel">
      <span class="picker-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M3 9h18M9 9v11"/>
        </svg>
      </span>
      <div class="picker-info">
        <span class="picker-label">فایل Excel انبار</span>
        <span class="picker-file" id="excel-name">انتخاب نشده</span>
      </div>
      <button class="btn btn-ghost" data-action="select-excel">انتخاب Excel</button>
    </div>

    <div class="field">
      <label for="brand-name">
        <svg class="field-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2 3 7v6c0 5 3.8 8.4 9 9 5.2-.6 9-4 9-9V7l-9-5Z"/>
        </svg>
        نام برند لیست قیمت
      </label>
      <input type="text" id="brand-name" placeholder="مثلاً: شوان">
    </div>

    <button class="btn btn-primary btn-block" id="btn-start" data-action="start" disabled>شروع تطبیق</button>
    <p class="hint" id="home-error"></p>
  </div>

  <details class="settings card">
    <summary>تنظیمات تطبیق</summary>
    <div class="settings-grid">
      <label>آستانه تطبیق مطمئن
        <input type="number" id="cfg-fuzzy" min="50" max="100">
      </label>
      <label>حداقل درصد تطبیق (زیر این مقدار قیمتی نمایش داده نمی‌شود)
        <input type="number" id="cfg-review" min="30" max="100">
      </label>
      <label>فاصله ابهام
        <input type="number" id="cfg-margin" min="0" max="30">
      </label>
      <label class="check">
        <input type="checkbox" id="cfg-ocr"> اجرای OCR برای PDF اسکن‌شده
      </label>
      <label class="check">
        <input type="checkbox" id="cfg-brand"> فقط کالاهایی که برندشان در لیست قیمت هست
      </label>
    </div>
    <button class="btn btn-ghost" data-action="save-config">ذخیره تنظیمات</button>
    <span class="hint" id="cfg-status"></span>
  </details>
</section>

<!-- ========================= PROCESSING ========================= -->
<section id="view-processing" class="view">
  <div class="card center">
    <h2 id="progress-title">در حال پردازش...</h2>
    <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
    <p class="progress-percent" id="progress-percent">0%</p>
    <ul class="steps" id="steps">
      <li data-step="pdf">خواندن PDF</li>
      <li data-step="excel">خواندن Excel</li>
      <li data-step="match">تطبیق کالاها</li>
      <li data-step="final">آماده‌سازی نتیجه</li>
    </ul>
  </div>
</section>

<!-- =========================== RESULTS ========================== -->
<section id="view-results" class="view">
  <p class="result-brand" id="result-brand"></p>
  <div class="summary" id="summary"></div>

  <div class="toolbar">
    <div class="filters" id="filters">
      <button class="chip active" data-filter="all">همه</button>
      <button class="chip" data-filter="priced">قیمت‌دار</button>
      <button class="chip" data-filter="matched">تطبیق‌شده</button>
      <button class="chip" data-filter="review">بررسی</button>
      <button class="chip" data-filter="not_found">یافت نشد</button>
      <button class="chip" data-filter="in_stock">موجود</button>
      <button class="chip" data-filter="out_of_stock">ناموجود</button>
    </div>
    <input type="search" id="search" placeholder="جستجو در کد یا نام کالا...">
    <div class="actions">
      <label class="check inline">
        <input type="checkbox" id="only-priced" checked> فقط ردیف‌های قیمت‌دار در PDF
      </label>
      <button class="btn btn-ghost" data-action="export-excel">خروجی Excel</button>
      <button class="btn btn-ghost" data-action="export-pdf">خروجی PDF</button>
      <button class="btn btn-ghost" data-action="new-run">فایل جدید</button>
    </div>
  </div>

  <p class="hint" id="result-status"></p>

  <div class="table-wrap">
    <table id="result-table">
      <thead>
        <tr>
          <th>کد کالا</th><th>نام کالا</th><th>موجودی</th><th>قیمت (تومان)</th>
        </tr>
      </thead>
      <tbody id="result-body"></tbody>
    </table>
    <button class="btn btn-ghost btn-block" id="btn-more" hidden>نمایش بیشتر</button>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
